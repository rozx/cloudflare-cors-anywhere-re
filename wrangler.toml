name = "cloudflare-cors-anywhere"
main = "index.js"
compatibility_date = "2026-07-01"
workers_dev = false
preview_urls = false
keep_vars = true  # Preserve remote environment variables from Cloudflare Dashboard

[vars]
ENABLE_BACKUP_FALLBACK = "false"
ENABLE_BACKUP_KV = "false"
MAX_RETRY_ATTEMPTS = "0"


# Public traffic must not generate retained logs or expose target query credentials.
[observability]
enabled = false

# Approximate limits per Cloudflare location. These are not billing caps.
[[ratelimits]]
name = "PROXY_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "PROXY_GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

# Version Metadata binding - provides access to deployment version information
# This enables Cloudflare's built-in version metadata (id, tag, timestamp)

[version_metadata]
binding = "CF_VERSION_METADATA"

# No KV binding in the public/free deployment. Backup caching is memory-only.
# Paid-plan CPU limits are intentionally omitted; Workers Free enforces 10 ms.
